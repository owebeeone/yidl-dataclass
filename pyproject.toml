[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "yidl-dataclass"
version = "0.1.0.dev0"
description = "Composable YIDL dataclasses with specialized field behavior"
requires-python = ">=3.12,<3.15"
dependencies = ["astichi==1.1.3", "yidl==0.1.0"]

[project.scripts]
yidl-dataclass-regenerate-base = "yidl_dataclass.regenerate_dataclass_base:main"

[project.optional-dependencies]
dev = ["pytest>=9.0", "black==26.3.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/yidl_dataclass"]

[tool.hatch.build.targets.sdist]
include = ["src/yidl_dataclass", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.yidl.test-matrix]
python = ["3.12", "3.13", "3.14"]
