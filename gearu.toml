[project]
name = "yidl-dataclass"
branch = "main"
remote = "origin"
tag_prefix = "v"
github_repo = "owebeeone/yidl-dataclass"

[python]
version = "static"
manifest = "pyproject.toml"

[release]
checks = [
    ["uv", "run", "--no-project", "--python", "3.13", "--with", "build==1.6.1", "--with", "twine==7.0.0", "python", "scripts/check_release.py"],
]
github_notes = """
yidl-dataclass {tag} — YIDL 0.1.4 and Astichi 1.1.5 dependency patch.

yidl-dataclass now pins YIDL 0.1.4 and Astichi 1.1.5. Astichi 1.1.5 fixes
CPython 3.15 provenance round-trips, ships a stable-ABI Windows wheel covering
Windows CPython 3.15 and fixes native-engine name hygiene. The generated base
is unchanged and the decorator API is unchanged. CPython 3.12–3.15 and both
lowering backends pass Gearu's release checks.
See dev-docs/DependencyPatchRelease.md for qualification.
"""
