[project]
name = "yidl-dataclass"
branch = "main"
remote = "origin"
tag_prefix = "v"
github_repo = "owebeeone/yidl-dataclass"

[python]
version = "static"
manifest = "pyproject.toml"

[release]
checks = [
    ["uv", "run", "--no-project", "--python", "3.13", "--with", "build==1.6.1", "--with", "twine==7.0.0", "python", "scripts/check_release.py"],
]
github_notes = """
yidl-dataclass {tag} — configurable runtime freeze method.

Adds freeze_method to the dataclass decorator, retaining freeze as the default.
Configured names reserve only their own field/method name. Typed child freezing
uses the child's configured method; a model inheritance family keeps one name.
Use a shared configured decorator to apply the choice across a record family.
CPython3.12–3.15 and both lowering backends retain their release qualification.

Opt-in freezable models still use optimistic, non-transactional permanent freeze.
See dev-docs/ConfigurableFreezeRelease.md for current qualification; Python315Release.md remains historical evidence.
The original experiment, reviews, time and token/cost evidence remain in dev-docs/.
"""
