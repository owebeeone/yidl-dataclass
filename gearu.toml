[project]
name = "yidl-dataclass"
branch = "main"
remote = "origin"
tag_prefix = "v"
github_repo = "owebeeone/yidl-dataclass"

[python]
version = "static"
manifest = "pyproject.toml"

[release]
checks = [
    ["uv", "run", "--no-project", "--python", "3.13", "--with", "build==1.6.1", "--with", "twine==7.0.0", "python", "scripts/check_release.py"],
]
github_notes = """
yidl-dataclass {tag} — Python 3.15 compatibility patch.

Adds CPython 3.15 to both backend matrices, source goldens and installed wheel/sdist
verification. Adapts metadata harvesting to Python 3.15's dataclasses sentinel and
non-evaluating annotation helper while retaining the 3.12–3.14 behavior.

Opt-in freezable models still use optimistic, non-transactional permanent freeze.
See dev-docs/Python315Release.md for qualification and the prior 0.1.0 publication.
The original experiment, reviews, time and token/cost evidence remain in dev-docs/.
"""
